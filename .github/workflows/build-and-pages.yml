name: Build Protocol Seven RPG and Publish Project Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build current cc65 toolchain
        run: |
          git clone --depth 1 https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 -j2
          echo "/tmp/cc65/bin" >> "$GITHUB_PATH"
          /tmp/cc65/bin/cl65 --version

      - name: Compile game
        run: make

      - name: Assemble public project page
        run: |
          mkdir -p public/downloads
          cp -R site/. public/
          cp build/PROTOCOL.PRG public/downloads/PROTOCOL.PRG
          cp README.md public/PROJECT_README.md
          printf '%s\n' "Build: ${GITHUB_SHA}" > public/downloads/BUILD.txt
          touch public/.nojekyll

      - name: Upload playable PRG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protocol-Seven-The-Ash-Ledger-X16
          path: build/PROTOCOL.PRG
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
