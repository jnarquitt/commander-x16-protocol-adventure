name: Build Game and Publish Project Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Commander X16 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes cc65
          cl65 --version

      - name: Compile game
        run: make

      - name: Assemble public project page
        run: |
          mkdir -p public/downloads
          cp -R site/. public/
          cp build/PROTOCOL.PRG public/downloads/PROTOCOL.PRG
          cp README.md public/PROJECT_README.md
          printf '%s\n' "Build: ${GITHUB_SHA}" > public/downloads/BUILD.txt
          touch public/.nojekyll

      - name: Upload playable PRG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Commander-X16-Protocol-Adventure
          path: build/PROTOCOL.PRG
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

